# Demo simulation. Read as cfg.simulations.
# data:  used by DataPreprocessor to build the scenarios in data/processed/
# model: used by DataLoader and the model

name: demo

# SCENARIO GENERATION
data:
  scenarios: 100             # |Omega|, bootstrapped scenarios (test size; final: 100)
  weeks: 3                 # |T|, weeks per scenario, drawn from history (test size; final: 48)
  seed: 42                  # random seed of the bootstrap

  player_size:
    generator_size: 600     # MWh, mean weekly production
    load_size: 600          # MWh, mean weekly consumption

# MODEL
model:
  NBS:
    tau_G: 0.5              # Bargaining power seller (tau^L = 1 - tau^G)
    epsilon: 1e-5           # minimum surplus w^G, w^L
    objective: nbs          # nbs: max tau ln w_G + tau_L ln w_L; joint: max W = w_G + w_L, then w_G = tau_G W

  risk_aversion:
    alpha_G: 0.9           # CVaR level, generator
    beta_G: 0.5             # risk-aversion weight, generator
    alpha_L: 0.9           # CVaR level, load
    beta_L: 0.5             # risk-aversion weight, load

  contract:
    strike_lower: 0         # EUR/MWh, lower bound on S
    strike_upper: 200       # EUR/MWh, upper bound on S
    volume_lower: 0         # MWh per week, lower bound on V
    volume_upper: 600        # MWh per week, upper bound on V
    quota_lower: 0.1        # MWh per hour, floor on q
    quota_upper: 10         # MWh per hour, cap on q

    guess:
      do: false
      strike: 25
      volume: 350

  binary_expansion:          # how the bilinear term rho V in strong duality is handled
    do: false                # true: binary expansion of V (MILP); false: bilinear rho V (Gurobi NonConvex)
    delta_V: 1              # MWh per week, grid step of V; digits K = ceil(log2(volume_upper / delta_V + 1))


# GUROBI SETTINGS
solver:                    # Gurobi parameters, passed as they are (names as in the Gurobi docs)
  MIPGap: 1e-6             # Gurobi default 1e-4  (range 0 to inf), relative gap to stop at
  NumericFocus: 0          # Gurobi default 0     (range 0 to 3), 0 automatic, 3 most careful with numerics
  FeasibilityTol: 1e-6     # Gurobi default 1e-6  (range 1e-9 to 1e-2), primal feasibility tolerance
  OptimalityTol: 1e-6      # Gurobi default 1e-6  (range 1e-9 to 1e-2), dual feasibility tolerance
  Cuts: -1                 # Gurobi default -1    (range -1 to 3), -1 automatic, 0 no cuts, 3 very aggressive
  Presolve: -1             # Gurobi default -1    (range -1 to 2), -1 automatic, 0 off, 2 aggressive
  TimeLimit: .inf          # Gurobi default inf   (seconds), the exporter keeps the best solution found
