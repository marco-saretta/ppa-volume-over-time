# @package _global_
# Merged into Hydra's default job logging.
# Output: "12:24:21 INFO    [solve]      message". Level and stage are padded so messages line up.
hydra:
  job_logging:
    formatters:
      simple:
        format: "%(asctime)s %(levelname)-7s %(stage)-13s %(message)s"
        datefmt: "%H:%M:%S"
